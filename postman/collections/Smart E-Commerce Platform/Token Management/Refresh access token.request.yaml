$kind: http-request
description: Generates a new access token using a valid refresh token. Provide the refresh_token in the request body.
url: http://127.0.0.1:8000/auth/refresh
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{\n  "refresh_token": "your_refresh_token_here"\n}'
order: 1000
