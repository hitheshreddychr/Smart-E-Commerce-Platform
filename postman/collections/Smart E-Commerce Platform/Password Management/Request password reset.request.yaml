$kind: http-request
description: Initiates a password reset flow by sending a reset link or token to the provided email address.
url: http://127.0.0.1:8000/auth/password/forgot
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{\n  "email": "user@example.com"\n}'
order: 1000
