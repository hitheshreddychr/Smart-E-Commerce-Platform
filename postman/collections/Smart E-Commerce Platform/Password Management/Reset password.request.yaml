$kind: http-request
description: Resets the user password using a valid reset token. Provide the reset token and the new password in the request body.
url: http://127.0.0.1:8000/auth/password/reset
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{\n  "token": "your_reset_token_here",\n  "new_password": "yournewpassword"\n}'
order: 2000
