services:
  fastapi:
    build: ./fastapi_backend
    container_name: ecommerce_fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./fastapi_backend/.env

  django:
    build: ./django_admin
    container_name: ecommerce_django
    ports:
      - "8001:8001"
    depends_on:
      - fastapi

  frontend:
    build: ./frontend
    container_name: ecommerce_frontend
    ports:
      - "5173:5173"
    depends_on:
      - fastapi